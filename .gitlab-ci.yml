stages:
  - mirror

mirror-github:
  stage: mirror
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    GIT_LFS_SKIP_SMUDGE: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH =~ /^rfr-/
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git git-lfs
    - git lfs install --skip-smudge
  script:
    - git remote add github "https://iotbzh-mirror:${GITHUB_TOKEN}@github.com/redpesk-labs/red-pak.git"
    # 1) les objets LFS d'abord, sinon GitHub rejette les refs
    - git lfs fetch --all origin
    - git lfs push --all github
    # 2) ensuite les refs
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git push github "refs/tags/${CI_COMMIT_TAG}"
      else
        git push github "HEAD:refs/heads/${CI_COMMIT_BRANCH}"
      fi